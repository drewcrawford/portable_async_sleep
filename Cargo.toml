[package]
name = "portable_async_sleep"
version = "0.1.2"
edition = "2024"
authors = ["Drew Crawford <drew@sealedabstract.com>"]
description = "A portable async sleep function for Rust"
repository = "https://github.com/drewcrawford/portable_async_sleep"
homepage = "https://sealedabstract.com/code/portable_async_sleep"
license = "MIT OR Apache-2.0"
categories = ["asynchronous", "os","concurrency","date-and-time"]
keywords = ["async", "sleep", "portable"]
exclude = [".*", "INVESTIGATION.md"]
rust-version = "1.85.1"


[dependencies]
continue = "0.1"

[dev-dependencies]
futures = "0.3.31"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.99"
js-sys = "0.3.76"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.49"
web-time = "1.0"
